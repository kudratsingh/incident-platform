# Release engineering — build the platform image once, push to GHCR
# with a version tag, and expose that tag to the agent repo. The agent
# repo (`incident-commander`) consumes this image by digest for its
# contract snapshot tests (per agent-repo ADR 0007).
#
# One image, two entrypoints:
#   - `uvicorn app.main:app` (API — the default CMD)
#   - `uvicorn app.mcp.standalone:app` (MCP process — override in compose/ECS)
# Both live in `backend/app/`, share the service layer, and ship together.
#
# Trigger surfaces:
#   1. `push` on a `v*` tag  → real release, produces `ghcr.io/…:v1.2.3`
#      and `ghcr.io/…:latest`. Contract tag is `platform-v1.2.3`.
#   2. `workflow_dispatch`   → manual pre-release / smoke-test build.
#      Tagged with the input version or the short SHA.
#
# Requires the repository's Actions to have `packages: write`. GHCR uses
# the built-in `GITHUB_TOKEN` — no extra secret provisioning.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual build (e.g. v0.4.0-rc1)"
        required: false
        default: ""

jobs:
  build-and-push:
    name: Build & push platform image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/incident-platform"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### Platform image published"
            echo ""
            echo "- **Version**: \`${{ steps.tags.outputs.version }}\`"
            echo "- **Image**: \`${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}\`"
            echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Agent-side contract snapshot pins should reference this digest."
          } >> "$GITHUB_STEP_SUMMARY"
