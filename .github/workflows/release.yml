# Release engineering — build the platform images once, push to GHCR
# with a version tag, and expose that tag to the agent repo. The agent
# repo (`incident-commander`) consumes the platform image by digest for its
# contract snapshot tests (per agent-repo ADR 0007).
#
# TWO images, on the same version, from the same commit:
#   ghcr.io/<owner>/incident-platform           the backend
#   ghcr.io/<owner>/incident-platform-console   the React console (WO-R3-313)
#
# The console ships here rather than only in `docker-compose.yml` because the
# commander's demo stack needs it by digest (owner decision A): the live demo
# runs the real console against the real platform, and a console built from a
# local checkout is not the thing a release can be pinned to. Both digests are
# printed in the run summary and both are what a release records; a backend that
# has moved and a console that has not is the drift this ordering prevents.
#
# The backend image is one image with two entrypoints:
#   - `uvicorn app.main:app` (API — the default CMD)
#   - `uvicorn app.mcp.standalone:app` (MCP process — override in compose/ECS)
# Both live in `backend/app/`, share the service layer, and ship together.
#
# Trigger surfaces:
#   1. `push` on a `v*` tag  → real release, produces `ghcr.io/…:v1.2.3`
#      and `ghcr.io/…:latest`. Contract tag is `platform-v1.2.3`. This is
#      the ONLY path that moves `:latest`.
#   2. `workflow_dispatch`   → manual pre-release / smoke-test build.
#      Tagged with the input version (format-validated as vX.Y.Z or
#      vX.Y.Z-rcN, and refused if that tag already exists on GHCR) or,
#      absent an input, the short commit SHA. Dispatch builds never
#      move `:latest`.
#
# Which of the two a run takes is decided by the EVENT NAME, never by the
# ref type. A `workflow_dispatch` may be started from any ref the repo has,
# including a `v*` tag — so `GITHUB_REF_TYPE` says "tag" for both surfaces
# and cannot tell them apart. Gating on it (as this workflow did until
# WO-R2-31) sent a manual smoke-test build launched from a tag down the full
# release path: it moved `:latest`, skipped the version-format check and the
# GHCR collision refusal, and discarded the version input entirely.
#
# Requires the repository's Actions to have `packages: write`. GHCR uses
# the built-in `GITHUB_TOKEN` — no extra secret provisioning.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual build (e.g. v0.4.0-rc1)"
        required: false
        default: ""

jobs:
  build-and-push:
    name: Build & push platform images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        # The dispatch input reaches the script only through env — raw
        # ${{ }} interpolation of free text inside run: is a shell-injection
        # surface. (`github.repository_owner` below is fine: an owner name,
        # not free text.)
        #
        # Behaviour is covered by .github/release-path-check.py, which
        # extracts this script and runs it under both event names.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/incident-platform"
          CONSOLE_IMAGE="ghcr.io/${{ github.repository_owner }}/incident-platform-console"

          # vX.Y.Z or vX.Y.Z-rcN. Applied to BOTH paths: the `v*` glob on the
          # push trigger also matches junk like `vfoo`, which would otherwise
          # be published verbatim AND moved to :latest with no check at all.
          version_format_ok() {
            [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          }

          # Event name, not ref type — see the header. A dispatch started
          # from a tag ref has GITHUB_REF_TYPE=tag and must NOT land here.
          # The ref-type conjunct is defence in depth, not the discriminator:
          # `on.push.tags` already guarantees it, and if a push ever arrives
          # some other way it falls through to the safe SHA-tag branch.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Real release (v* tag push): the only path that publishes
            # :latest. Deliberately NO collision check on this path —
            # re-releasing after deleting a git tag + its GHCR tag is a
            # legitimate flow, and the commander pins images by digest,
            # which contains a force-moved tag.
            VERSION="${GITHUB_REF_NAME}"
            version_format_ok "${VERSION}" || {
              echo "::error::bad tag format: ${VERSION} (expected vX.Y.Z or vX.Y.Z-rcN)"
              exit 1
            }
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version_format_ok "${INPUT_VERSION}" || {
              echo '::error::bad version format (expected vX.Y.Z or vX.Y.Z-rcN)'
              exit 1
            }
            # The GHCR login happened in the previous step. `docker manifest
            # inspect` exits non-zero when the tag is absent; the if-condition
            # position is exempt from `set -e`.
            #
            # BOTH images are checked. Checking only the backend would let a
            # dispatch overwrite a published console tag whenever the two had
            # got out of step, which is exactly when it matters.
            if docker manifest inspect "${IMAGE}:${INPUT_VERSION}" >/dev/null 2>&1; then
              echo '::error::tag already exists on GHCR — refusing to overwrite a published version'
              exit 1
            fi
            if docker manifest inspect "${CONSOLE_IMAGE}:${INPUT_VERSION}" >/dev/null 2>&1; then
              echo '::error::console tag already exists on GHCR — refusing to overwrite a published version'
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            TAGS="${IMAGE}:${VERSION}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
            TAGS="${IMAGE}:${VERSION}"
          fi

          # The console's tags follow the backend's by construction rather than
          # by a second copy of the branching above, so the two cannot drift:
          # same version always, and :latest exactly when the backend moves it.
          CONSOLE_TAGS="${CONSOLE_IMAGE}:${VERSION}"
          if [[ "${TAGS}" == *":latest"* ]]; then
            CONSOLE_TAGS="${CONSOLE_TAGS},${CONSOLE_IMAGE}:latest"
          fi

          # Belt and braces. Unreachable while the branches above are correct,
          # which is the point: if a future edit reintroduces the ref-type
          # discriminator, this refuses the run instead of silently
          # republishing a released version and moving :latest.
          if [[ ( "${TAGS}" == *":latest"* || "${CONSOLE_TAGS}" == *":latest"* ) && "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "::error::refusing to move :latest from a ${GITHUB_EVENT_NAME} event"
            exit 1
          fi
          {
            echo "image=${IMAGE}"
            echo "console_image=${CONSOLE_IMAGE}"
            echo "version=${VERSION}"
            echo "tags=${TAGS}"
            echo "console_tags=${CONSOLE_TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build & push backend
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The console. Its own build context is `frontend/`, so it shares nothing
      # with the backend build but the version — and the separate gha cache
      # scope keeps a Node build from evicting the Python layers.
      - name: Build & push console
        id: build-console
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.console_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

      - name: Summarize
        run: |
          {
            echo "### Platform images published"
            echo ""
            echo "- **Version**: \`${{ steps.tags.outputs.version }}\`"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| \`${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}\` | \`${{ steps.build.outputs.digest }}\` |"
            echo "| \`${{ steps.tags.outputs.console_image }}:${{ steps.tags.outputs.version }}\` | \`${{ steps.build-console.outputs.digest }}\` |"
            echo ""
            echo "Agent-side contract snapshot pins should reference the BACKEND digest."
            echo "The commander's \`demo/compose.yml\` pins the CONSOLE digest for its"
            echo "\`console\` service (\`API_UPSTREAM=http://api:8000\` is that image's default)."
          } >> "$GITHUB_STEP_SUMMARY"
