name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check backend/

      - name: Mypy
        run: mypy -p app

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incident_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/incident_platform_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=70

  infra:
    name: Infra
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
          # No wrapper — the chaos-gate step below inspects terraform's own
          # exit code and output, and the wrapper would sit between them.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -diff

      - name: Terraform init (no backend)
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      # F2-15: Redis must stay encrypted. `validate` cannot catch a revert to
      # the bare aws_elasticache_cluster resource (an unencrypted cluster is
      # still valid HCL), so pin the two encryption flags textually.
      - name: ElastiCache encryption flags present
        run: grep -q transit_encryption_enabled infra/elasticache.tf && grep -q at_rest_encryption_enabled infra/elasticache.tf

      # ADR 0008: the production workspace must refuse chaos_enabled=true.
      # `terraform validate` cannot prove this — variable validations are only
      # evaluated by plan/apply with concrete values — so this is a negative
      # plan. It runs credential-free: the validation failure alone forces a
      # non-zero exit and puts its message in the output (the runner having no
      # AWS credentials merely adds unrelated provider errors alongside).
      # Deliberately no positive plan (chaos in staging): a valid plan proceeds
      # to provider configuration and would fail on missing credentials — the
      # wrong reason.
      - name: Chaos gate refuses production (negative plan)
        run: |
          set -euo pipefail
          if terraform -chdir=infra plan -input=false -refresh=false \
              -var chaos_enabled=true -var environment=production -no-color \
              > plan-output.txt 2>&1; then
            echo "ERROR: plan succeeded — the production chaos gate is gone." >&2
            cat plan-output.txt
            exit 1
          fi
          echo "Plan refused (non-zero exit), as required. Verifying the refusal reason..."
          # Terraform word-wraps diagnostics on non-TTY output, so normalize
          # whitespace before matching the error_message substring.
          if ! tr -s '[:space:]' ' ' < plan-output.txt | grep -Fq "refused in the production workspace (ADR 0008)"; then
            echo "ERROR: plan failed, but not with the ADR 0008 production-refusal message:" >&2
            cat plan-output.txt
            exit 1
          fi
          echo "Chaos gate verified: chaos_enabled=true is refused when environment=production."

  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    # Opt-in. AWS credentials are not configured, so this job failed at
    # "Configure AWS credentials" on every master push and left master red —
    # burying the signal from lint/test/frontend. Gating on a repository
    # variable makes it skip cleanly instead of failing.
    #
    # To re-enable: configure the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # secrets, then set the ENABLE_ECS_DEPLOY repository variable to 'true'.
    # Re-enabling means every master merge deploys to real infrastructure —
    # check what is queued to ship before flipping it.
    if: >-
      github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && vars.ENABLE_ECS_DEPLOY == 'true'

    env:
      AWS_REGION: us-east-1
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_ENV

      # ── Build & push backend ────────────────────────────────────────────────
      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/incident-platform/backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/incident-platform/backend:latest \
            .

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/incident-platform/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/incident-platform/backend:latest

      # ── Build & push frontend ───────────────────────────────────────────────
      - name: Build frontend image
        run: |
          docker build \
            -t $ECR_REGISTRY/incident-platform/frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/incident-platform/frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/incident-platform/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/incident-platform/frontend:latest

      # ── Deploy backend ──────────────────────────────────────────────────────
      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition incident-platform-backend \
            --query taskDefinition \
            > backend-task-def.json

      - name: Update backend image in task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ env.ECR_REGISTRY }}/incident-platform/backend:${{ env.IMAGE_TAG }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: incident-platform-backend
          cluster: incident-platform
          wait-for-service-stability: true

      # ── Deploy frontend ─────────────────────────────────────────────────────
      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition incident-platform-frontend \
            --query taskDefinition \
            > frontend-task-def.json

      - name: Update frontend image in task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ env.ECR_REGISTRY }}/incident-platform/frontend:${{ env.IMAGE_TAG }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: incident-platform-frontend
          cluster: incident-platform
          wait-for-service-stability: true
