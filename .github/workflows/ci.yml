name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      # eslint 9 flat config (frontend/eslint.config.js). The script carries
      # --max-warnings 0 because react-hooks/exhaustive-deps is a warning in
      # the plugin's recommended tier, and eslint exits 0 on warnings — without
      # it a missing-dependency regression would pass this job silently.
      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check backend/

      - name: Mypy
        run: mypy -p app

  # Unit + API only — `testpaths` in pyproject.toml scopes bare `pytest` to
  # those two directories. This job deliberately provisions NO services: the
  # suite it runs uses an in-memory SQLite engine and a mocked Redis (see
  # backend/tests/conftest.py), so the Postgres and Redis service containers
  # that used to sit here — along with the DATABASE_URL / REDIS_URL they
  # exported — were read by nothing and implied coverage this job never had.
  # Real-server coverage lives in the `integration` job below, which brings
  # its own containers up through Testcontainers.
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=70

  # The Docker-gated tier: real Postgres 16 and real Redpanda, brought up per
  # module by Testcontainers. These five files are the only proofs the repo
  # has of Postgres RLS tenant isolation, audit-log immutability and outbox
  # single-writer exclusivity, and until this job existed none of them ran in
  # any automated run — `testpaths` excluded the directory and the three
  # RUN_* gates were set nowhere.
  #
  # The tier stays opt-in locally (a developer without Docker still gets a
  # clean unit/API run) but is mandatory here: every gate its tests consult
  # is exported below, so a skipped test means a gate regressed, not that the
  # environment is unsuitable. The census step turns that into a hard failure
  # — an all-skipped run would otherwise report success and put this job
  # straight back into the misleading-green state it was added to end.
  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest

    env:
      RUN_RLS_TEST: "1"
      RUN_EVAL_RESET_TEST: "1"
      RUN_MIGRATION_LOCK_TEST: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Two of the five files (test_kafka_e2e, test_outbox_relay_concurrency)
      # gate purely on Docker being reachable, with no env override. If the
      # daemon were missing they would skip silently and the census below
      # would fail with a confusing count, so assert the real precondition
      # here and fail with a message that names it.
      - name: Docker must be available
        run: |
          set -euo pipefail
          if ! docker info > /dev/null 2>&1; then
            echo "ERROR: no reachable Docker daemon — the integration tier cannot run." >&2
            exit 1
          fi
          echo "OK: Docker daemon reachable."

      # --no-cov: the repo-wide addopts carry --cov-fail-under=70, measured
      # against all of backend/app. This tier exercises migrations, RLS and
      # the relay rather than the request surface, so it cannot clear that
      # bar on its own and the gate belongs to the `test` job.
      - name: Run integration tests
        run: |
          pytest backend/tests/integration \
            -v -ra --no-cov --junitxml=integration-results.xml

      # Proof of work: assert the tier actually executed. pytest exits 0 on a
      # fully-skipped run, which is exactly how this tier stayed invisible.
      - name: Census — every integration file ran, nothing skipped
        if: always()
        run: |
          python3 - <<'EOF'
          import collections
          import sys
          import xml.etree.ElementTree as ET

          # The five files this job exists to run. A rename or deletion must
          # be a deliberate edit here, not a silently shrinking test count.
          EXPECTED = {
              "test_rls_enforcement",
              "test_eval_reset_postgres",
              "test_kafka_e2e",
              "test_migration_lock_pg",
              "test_outbox_relay_concurrency",
          }

          try:
              root = ET.parse("integration-results.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              print(f"ERROR: no usable JUnit report ({exc}) — pytest did not get far enough.")
              sys.exit(1)

          per_file = collections.Counter()
          skipped = []
          for case in root.iter("testcase"):
              module = (case.get("classname") or "").split(".")[-1]
              per_file[module] += 1
              if case.find("skipped") is not None:
                  skipped.append(f"{module}::{case.get('name')}")

          print("Collected tests per integration file:")
          for module in sorted(per_file):
              print(f"  {module:<34} {per_file[module]:>3}")
          print(f"  {'TOTAL':<34} {sum(per_file.values()):>3}")

          failed = False
          missing = EXPECTED - set(per_file)
          if missing:
              print(f"\nERROR: these files contributed no tests: {sorted(missing)}")
              failed = True
          if skipped:
              print(f"\nERROR: {len(skipped)} test(s) skipped — every gate is set in this job,")
              print("so a skip means a gate regressed, not that the environment is unsuitable:")
              for name in skipped:
                  print(f"  {name}")
              failed = True
          sys.exit(1 if failed else 0)
          EOF

  infra:
    name: Infra
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.x"
          # No wrapper — the chaos-gate step below inspects terraform's own
          # exit code and output, and the wrapper would sit between them.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -diff

      - name: Terraform init (no backend)
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      # F2-15: Redis must stay encrypted. `validate` cannot catch a revert to
      # the bare aws_elasticache_cluster resource (an unencrypted cluster is
      # still valid HCL), so pin the two encryption flags textually.
      - name: ElastiCache encryption flags present
        run: grep -q transit_encryption_enabled infra/elasticache.tf && grep -q at_rest_encryption_enabled infra/elasticache.tf

      # F2-07 / ADR 0018: production Kafka is deliberately not provisioned, and
      # the docs spent four files claiming otherwise by pointing at a Terraform
      # file that never existed in any ref. Prose-only corrections decay — this
      # finding is the proof — so the absence of that phantom filename is
      # asserted mechanically. A hit here means the docs have drifted back.
      - name: No references to a phantom Kafka Terraform module
        run: |
          set -euo pipefail
          if grep -rn 'msk\.tf' CLAUDE.md README.md docs/; then
            echo "ERROR: the lines above reference infra/msk.tf, which does not exist." >&2
            echo "Production Kafka is not provisioned — see docs/ADR/0018-production-kafka-posture.md." >&2
            exit 1
          fi
          echo "OK: no documentation references a phantom Kafka Terraform module."

      # ADR 0008: the production workspace must refuse chaos_enabled=true.
      # `terraform validate` cannot prove this — variable validations are only
      # evaluated by plan/apply with concrete values — so this is a negative
      # plan. It runs credential-free: the validation failure alone forces a
      # non-zero exit and puts its message in the output (the runner having no
      # AWS credentials merely adds unrelated provider errors alongside).
      # Deliberately no positive plan (chaos in staging): a valid plan proceeds
      # to provider configuration and would fail on missing credentials — the
      # wrong reason.
      - name: Chaos gate refuses production (negative plan)
        run: |
          set -euo pipefail
          if terraform -chdir=infra plan -input=false -refresh=false \
              -var chaos_enabled=true -var environment=production -no-color \
              > plan-output.txt 2>&1; then
            echo "ERROR: plan succeeded — the production chaos gate is gone." >&2
            cat plan-output.txt
            exit 1
          fi
          echo "Plan refused (non-zero exit), as required. Verifying the refusal reason..."
          # Terraform word-wraps diagnostics on non-TTY output, so normalize
          # whitespace before matching the error_message substring.
          if ! tr -s '[:space:]' ' ' < plan-output.txt | grep -Fq "refused in the production workspace (ADR 0008)"; then
            echo "ERROR: plan failed, but not with the ADR 0008 production-refusal message:" >&2
            cat plan-output.txt
            exit 1
          fi
          echo "Chaos gate verified: chaos_enabled=true is refused when environment=production."

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # actionlint checks every workflow under .github/workflows/ — YAML
      # syntax, expression types, and shellcheck on run: scripts. Both the
      # download script (pinned by commit, like the actions above) and the
      # binary version are fixed, so runs are reproducible.
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash") 1.7.12
          ./actionlint -color

      # Regression guard for the release.yml injection fix: workflow_dispatch
      # inputs may reach a script only via env (e.g. INPUT_VERSION), never by
      # expression interpolation inside a run: body. actionlint does not treat
      # dispatch inputs as untrusted, so this is asserted explicitly.
      - name: Forbid dispatch-input interpolation in run scripts
        run: |
          python3 - <<'EOF'
          import glob
          import re
          import sys

          import yaml

          PATTERN = re.compile(r"github\.event\.inputs|\$\{\{\s*inputs\.")
          bad = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              for job_id, job in (doc.get("jobs") or {}).items():
                  for idx, step in enumerate(job.get("steps") or [], start=1):
                      run = step.get("run")
                      if isinstance(run, str) and PATTERN.search(run):
                          name = step.get("name", f"step {idx}")
                          bad.append(
                              f"{path}: job '{job_id}', step '{name}': "
                              "workflow_dispatch input interpolated inside "
                              "run: — pass it via env instead"
                          )
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("OK: no run: script interpolates workflow_dispatch inputs.")
          EOF

  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    needs: [lint, test, integration, frontend]
    # Opt-in. AWS credentials are not configured, so this job failed at
    # "Configure AWS credentials" on every master push and left master red —
    # burying the signal from lint/test/frontend. Gating on a repository
    # variable makes it skip cleanly instead of failing.
    #
    # To re-enable: configure the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # secrets, then set the ENABLE_ECS_DEPLOY repository variable to 'true'.
    # Re-enabling means every master merge deploys to real infrastructure —
    # check what is queued to ship before flipping it.
    if: >-
      github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && vars.ENABLE_ECS_DEPLOY == 'true'

    env:
      AWS_REGION: us-east-1
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set ECR registry
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_ENV"

      # ── Build & push backend ────────────────────────────────────────────────
      - name: Build backend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/incident-platform/backend:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/incident-platform/backend:latest" \
            .

      - name: Push backend image
        run: |
          docker push "$ECR_REGISTRY/incident-platform/backend:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/incident-platform/backend:latest"

      # ── Build & push frontend ───────────────────────────────────────────────
      - name: Build frontend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/incident-platform/frontend:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/incident-platform/frontend:latest" \
            ./frontend

      - name: Push frontend image
        run: |
          docker push "$ECR_REGISTRY/incident-platform/frontend:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/incident-platform/frontend:latest"

      # ── Deploy backend ──────────────────────────────────────────────────────
      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition incident-platform-backend \
            --query taskDefinition \
            > backend-task-def.json

      - name: Update backend image in task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ env.ECR_REGISTRY }}/incident-platform/backend:${{ env.IMAGE_TAG }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: incident-platform-backend
          cluster: incident-platform
          wait-for-service-stability: true

      # ── Deploy frontend ─────────────────────────────────────────────────────
      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition incident-platform-frontend \
            --query taskDefinition \
            > frontend-task-def.json

      - name: Update frontend image in task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ env.ECR_REGISTRY }}/incident-platform/frontend:${{ env.IMAGE_TAG }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: incident-platform-frontend
          cluster: incident-platform
          wait-for-service-stability: true
