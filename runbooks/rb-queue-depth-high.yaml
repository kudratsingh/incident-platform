id: rb-queue-depth-high
title: Job backlog above 50
severity: medium
alarm: incident-platform-queue-depth-high

summary: |
  The Kafka consumer is more than 50 jobs behind, for 3 minutes. Either
  worker throughput is too low or a downstream dependency is blocking
  processors. The alarm reads ConsumerLag: QueueDepth measures only the
  Redis delayed-retry set and can sit at zero through a total backlog.
  New job submissions will start returning 503 (backpressure) once the
  consumer lag crosses its threshold.

symptoms:
  - "ConsumerLag metric trending up steadily"
  - "Job dispatch latency SLO (rb-slo-dispatch-latency) burning fast"
  - "POST /api/v1/jobs returning 503 backpressure responses"

diagnosis_steps:
  - id: check-worker-alive
    description: >-
      First: is the worker running at all? ConsumerLag and every metric below
      it are emitted by loops inside the worker, and ConsumerLag is not
      emitted when the lag is unknown — so a dead worker makes them absent
      rather than high, and this alarm treats missing data as notBreaching.
      It will not fire for the worst case, which is why this step comes
      first. A `"worker": "error"` answer means job processing has stopped
      entirely; `worker_detail` carries the state, restart count, last error
      and how long since the worker's loops last turned.
    command: "curl -s -o /dev/null -w '%{http_code}' http://<task>:8000/api/v1/health; curl -s http://<task>:8000/api/v1/health | jq '{worker, worker_detail}'"
  - id: check-consumer-lag
    description: "How far behind is the dispatcher consumer?"
    command: "CloudWatch metric IncidentPlatform/ConsumerLag"
  - id: check-in-flight
    description: "Are workers actually doing work, or stuck?"
    command: "CloudWatch metric IncidentPlatform/InFlightJobs"
  - id: check-processor-errors
    description: "Are any specific job types failing repeatedly?"
    command: "CloudWatch metric IncidentPlatform/JobFailed dimensioned by JobType"
  - id: external-deps
    description: "Are external APIs the bulk_api_sync calls saturated or rate-limited?"

mitigation:
  - "Scale the worker tasks horizontally (raise desired count of the worker ECS service)."
  - "If one job type is stuck: pause new submissions of that type via a feature flag while you investigate."
  - "If external API is the bottleneck: confirm circuit breaker opened; let it shed load."

escalation:
  - "If ConsumerLag keeps climbing for > 30 minutes despite scale-out, page on-call."

related_dashboards:
  - "IncidentPlatform → QueueDepth, InFlightJobs, ConsumerLag"
