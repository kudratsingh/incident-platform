id: rb-rds-cpu-high
title: RDS CPU above 80%
severity: medium
alarm: incident-platform-rds-cpu-high

summary: |
  Postgres CPU has been above 80% for 3 minutes. Query latency on API
  endpoints will be visibly degraded; user-facing impact depends on which
  queries are dominating.

symptoms:
  - "Elevated p99 API latency"
  - "Slow admin queries (job list, audit log scans)"
  - "Possible correlated alarm: ALB 5xx if requests hit pool timeouts"

diagnosis_steps:
  - id: top-queries
    description: "Identify the highest-cost queries in pg_stat_statements."
    command: "psql -c 'SELECT calls, mean_exec_time, query FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20'"
  - id: check-locks
    description: "Look for blocked queries or long-running transactions."
    command: "psql -c \"SELECT pid, usename, state, query_start, query FROM pg_stat_activity WHERE state != 'idle' ORDER BY query_start LIMIT 20\""
  - id: missing-indexes
    description: "Any seq scans on hot tables (jobs, audit_logs)?"
    command: "psql -c 'SELECT relname, seq_scan, idx_scan FROM pg_stat_user_tables ORDER BY seq_scan DESC LIMIT 10'"

mitigation:
  - "If one query dominates: identify the missing index from the EXPLAIN plan and add it."
  - "If admin scans are the culprit: route /admin/* to a read replica (Phase 8)."
  - "Short-term relief: scale the RDS instance class up one tier."

escalation:
  - "If RDS CPU stays above 95% for > 30 minutes, page DBA on-call."
  - "If queries can't be identified, capture pg_stat_statements snapshot and open a ticket."

related_dashboards:
  - "RDS → CPUUtilization, DatabaseConnections"
  - "Performance Insights → top SQL"
