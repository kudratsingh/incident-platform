services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
        rpk topic create job.submitted --brokers=redpanda:9092 --partitions=6 --replicas=1 &&
        rpk topic create job.progress  --brokers=redpanda:9092 --partitions=6 --replicas=1 &&
        rpk topic create job.completed --brokers=redpanda:9092 --partitions=6 --replicas=1 &&
        rpk topic create job.failed    --brokers=redpanda:9092 --partitions=6 --replicas=1 &&
        rpk topic create job.dlq       --brokers=redpanda:9092 --partitions=6 --replicas=1
      "

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  migrate:
    # Single dedicated migration runner. app + mcp both `depends_on`
    # this with `condition: service_completed_successfully`, so exactly
    # one process ever executes `alembic upgrade head`. An earlier
    # arrangement had app + mcp each run migrations on boot; concurrent
    # `CREATE TABLE` statements race on Postgres's `pg_type` uniqueness
    # and the loser 500s. Deterministic serialisation kills the race.
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      PYTHONPATH: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      ENVIRONMENT: development
      DEBUG: "true"
      OTLP_ENDPOINT: http://jaeger:4318
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # `/app/backend` is the Python root — internal imports use
      # `from app.<x> import ...`, not `backend.app.<x>`. Setting
      # PYTHONPATH here mirrors what scripts/entrypoint.sh does; the
      # compose `command:` below bypasses that script so we need this
      # explicitly. If you edit the command, keep PYTHONPATH aligned.
      PYTHONPATH: /app/backend
      # Opt-in — populate deploy_markers / alerts / DLQ / dag with
      # realistic data during boot. Idempotent. Off by default; the
      # incident-commander agent flips this on in its own compose so
      # `make eval-live` runs against a seeded platform without a
      # separate step.
      SEED_EVAL_FIXTURES: "false"
      # Chaos framework — enabled here for local dev + agent live-eval
      # remediation scenarios (Phase 6 needs a real broken state to
      # fix, not a healthy platform to observe). Safe by construction:
      # `assert_chaos_gate` in app + mcp startup refuses the
      # (CHAOS_ENABLED=true, ENVIRONMENT=production) combination, and
      # Terraform's `chaos_enabled` variable validation refuses it in
      # the production workspace. See ADR 0008. Flip to "false" if you
      # want a chaos-free local dev stack.
      CHAOS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      # scripts/ isn't in the Dockerfile COPY list (only entrypoint.sh
      # is), so operator scripts like seed_incident_commander.py aren't
      # baked into the image. Mount the whole directory so
      # `docker compose exec app python scripts/<name>.py` just works.
      - ./scripts:/app/scripts
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  mcp:
    # Same image as `app`, different command. See ADR 0006 — the MCP
    # server is a standalone process built from the same codebase and
    # imports the service layer directly. Small DB pool matched to its
    # rate limits. Depends on `migrate` completing, so schema is at
    # head before any tool query lands.
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
      OTLP_ENDPOINT: http://jaeger:4318
      PYTHONPATH: /app/backend
      # Chaos framework — must match the `app` service's setting.
      # The @chaos_tool decorators evaluate this at MCP process import
      # time, so with CHAOS_ENABLED=true the 5 chaos tools register
      # (kill_consumer, poison_message, saturate_redis, inject_latency,
      # bad_deploy); with false they're absent from tools/list. See
      # ADR 0008 for the triple gate.
      CHAOS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    command:
      - uvicorn
      - app.mcp.standalone:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  minio_data:
