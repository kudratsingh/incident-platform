services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    # Idempotent, and kept in step with incident-commander/demo/compose.yml's
    # redpanda-init (the demo fixed this on 2026-08-08; the fix is mirrored
    # back here). `rpk topic create` exits 1 on an existing topic, so the old
    # `&&` chain hard-failed the whole one-shot on any bring-up where the
    # topics already existed — which now matters, because app and mcp below
    # wait on this service completing SUCCESSFULLY. TOPIC_ALREADY_EXISTS is
    # success for our purposes. `|| true` does mask genuine broker failures
    # at init time; that is deliberate — the consumers surface those loudly
    # when they boot, rather than the stack half-starting behind a one-shot.
    entrypoint: >
      /bin/bash -c "
        for t in job.submitted job.progress job.completed job.failed job.cancelled job.dlq; do
          rpk topic create $$t --brokers=redpanda:9092 --partitions=6 --replicas=1 || true;
        done
      "

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  migrate:
    # Single dedicated migration runner. app + mcp both `depends_on`
    # this with `condition: service_completed_successfully`, so exactly
    # one process ever executes `alembic upgrade head`. An earlier
    # arrangement had app + mcp each run migrations on boot; concurrent
    # `CREATE TABLE` statements race on Postgres's `pg_type` uniqueness
    # and the loser 500s. Deterministic serialisation kills the race.
    # The ECS path has no such one-shot — every task runs `alembic upgrade
    # head` from scripts/entrypoint.sh — and is now serialized instead by
    # the session-level advisory lock in app/core/migration_lock.py.
    build: .
    environment:
      # Superuser URL on purpose: migrations need DDL rights (the
      # two-URL scheme from ADR 0015 — the app/mcp services below run as
      # the non-owner incident_app role instead).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      # Local password for the incident_app role; db_bootstrap syncs it
      # after migrations. The app service's custom `command:` bypasses
      # scripts/entrypoint.sh, so the sync MUST ride this one-shot.
      INCIDENT_APP_DB_PASSWORD: localdev
      PYTHONPATH: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command:
      [
        "sh",
        "-c",
        "alembic -c /app/alembic.ini upgrade head && python -m app.core.db_bootstrap",
      ]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Non-owner incident_app role — same posture as production after
      # the ADR 0015 phase-2 flip. The superuser bypasses RLS silently,
      # so a superuser URL here would keep the local topology lying
      # about what the policies actually do. The role + password come
      # from the migrate one-shot above.
      DATABASE_URL: postgresql+asyncpg://incident_app:localdev@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      ENVIRONMENT: development
      DEBUG: "true"
      OTLP_ENDPOINT: http://jaeger:4318
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # `/app/backend` is the Python root — internal imports use
      # `from app.<x> import ...`, not `backend.app.<x>`. Setting
      # PYTHONPATH here mirrors what scripts/entrypoint.sh does; the
      # compose `command:` below bypasses that script so we need this
      # explicitly. If you edit the command, keep PYTHONPATH aligned.
      PYTHONPATH: /app/backend
      # Opt-in — populate deploy_markers / alerts / DLQ / dag with
      # realistic data during boot. Idempotent. Off by default; the
      # incident-commander agent flips this on in its own compose so
      # `make eval-live` runs against a seeded platform without a
      # separate step.
      SEED_EVAL_FIXTURES: "false"
      # Chaos framework — enabled here for local dev + agent live-eval
      # remediation scenarios (Phase 6 needs a real broken state to
      # fix, not a healthy platform to observe). Safe by construction:
      # `assert_chaos_gate` in app + mcp startup refuses the
      # (CHAOS_ENABLED=true, ENVIRONMENT=production) combination, and
      # Terraform's `chaos_enabled` variable validation refuses it in
      # the production workspace. See ADR 0008. Flip to "false" if you
      # want a chaos-free local dev stack.
      CHAOS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        # Topics must exist before the consumer groups subscribe. This
        # process hosts all 8 of them, and nothing depended on the one-shot
        # until now — invisible on a warm stack, but redpanda has no volume,
        # so on every cold bring-up the consumers could reach a broker with
        # no topics on it. Mirrors the `migrate` pattern below, and the
        # equivalent edge in incident-commander/demo/compose.yml.
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      # scripts/ IS baked into the image — Dockerfile does
      # `COPY scripts/ ./scripts/` — so `docker compose exec app python
      # scripts/<name>.py` works with or without this mount. The bind mount
      # stays so local edits to the seed/ops scripts take effect without an
      # image rebuild.
      - ./scripts:/app/scripts
      # services/runbooks.py resolves /app/runbooks at import (E2-03).
      # Mount the source dir so the dev stack sees it and --reload picks
      # up runbook YAML edits without a rebuild. Only `app` needs it —
      # the mcp process never imports app.services.runbooks.
      - ./runbooks:/app/runbooks
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  mcp:
    # Same image as `app`, different command. See ADR 0006 — the MCP
    # server is a standalone process built from the same codebase and
    # imports the service layer directly. Small DB pool matched to its
    # rate limits. Depends on `migrate` completing, so schema is at
    # head before any tool query lands.
    build: .
    ports:
      - "8001:8001"
    environment:
      # Non-owner incident_app role — see the app service comment.
      DATABASE_URL: postgresql+asyncpg://incident_app:localdev@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
      OTLP_ENDPOINT: http://jaeger:4318
      PYTHONPATH: /app/backend
      # poison_message is the only MCP tool that opens a direct Kafka
      # connection (every other tool routes through the outbox). The
      # config default is localhost:9092, which inside a container
      # resolves to the container itself and returns
      # KafkaConnectionError. Missing this env var on the mcp service
      # was the reason poison_message returned -32603 in v0.4.0 →
      # v0.4.2.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Chaos framework — must match the `app` service's setting.
      # The @chaos_tool decorators evaluate this at MCP process import
      # time, so with CHAOS_ENABLED=true the 5 chaos tools register
      # (kill_consumer, poison_message, saturate_redis, inject_latency,
      # bad_deploy); with false they're absent from tools/list. See
      # ADR 0008 for the triple gate.
      CHAOS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        # poison_message opens a direct Kafka connection (see the
        # KAFKA_BOOTSTRAP_SERVERS comment above), so mcp needs the broker up
        # and the topics created just as much as app does. It depended on
        # neither until now.
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    command:
      - uvicorn
      - app.mcp.standalone:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  minio_data:
